# Nombre del microservicio
spring.application.name=microservicio-solicitudes

# Puerto predeterminado del servicio
server.port=${SERVER_PORT:8081}

# Conexión MySQL entregada mediante variables de entorno
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME:misa_mesatech}
spring.datasource.password=${DB_PASSWORD}

# JPA crea y actualiza las tablas desde las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Endpoints de comprobación del servicio
management.endpoints.web.exposure.include=health,info