version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:4.2.9-management
    container_name: mesatech-rabbitmq
    hostname: rabbitmq-mesatech
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-Peppers2014*2601}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped

volumes:
  rabbitmq_data:
    driver: local